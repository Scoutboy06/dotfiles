- name: ngrok
  device: all
  requires_de: false
- name: opentabletdriver
  device: all
  requires_de: true
- name: pomodoro-tui
  device: all
  requires_de: false
- name: r-quick-share-bin
  device: all
  requires_de: true
- name: spicetify-cli
  device: all
  requires_de: true
- name: vesktop-bin
  device: all
  requires_de: true
- name: whisper.cpp-cuda-bin
  device: all
  requires_de: false
- name: zen-browser-bin
  device: all
  requires_de: true
