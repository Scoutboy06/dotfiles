# Package definitions for chezmoi
# Used by run_onchange_before_install-packages.sh.tmpl
#
# Structure:
#   common: packages for all machines (pacman)
#   aur: AUR packages for all machines
#   desktop: desktop-only packages
#   laptop: laptop-only packages

common:
  # Core
  - git
  - python
  - stow

  # Hyprland desktop
  - hyprland
  - hyprlock
  - hypridle
  - waybar
  - xdg-desktop-portal-hyprland

  # Session management
  - uwsm

  # Wayland utilities
  - brightnessctl
  - wl-clipboard
  - grim
  - slurp
  - hyprpicker
  - satty

  # Audio
  - pipewire
  - pipewire-pulse
  - wireplumber
  - pamixer
  - libpulse  # pactl for audio-switch

  # Notifications
  - libnotify
  - mako

  # Screen recording
  - gpu-screen-recorder
  - ffmpeg
  - mpv

  # Network
  - iw
  - networkmanager

  # File manager
  - nautilus

  # Fonts
  - ttf-cascadia-mono-nerd

aur:
  # App launcher
  - walker
  - elephant-all-bin
  - xdg-terminal-exec

  # Terminal
  - ghostty

  # Apps
  - 1password
  - obsidian
  - spotify
  - sublime-text-4

desktop:
  # Drawing tablet (desktop only)
  - opentabletdriver

  # Extra utilities
  - gnome-disk-utility

laptop:
  # Battery monitoring
  - upower

  # Power management
  - power-profiles-daemon

optional:
  # Development
  - docker
  - lazygit

  # System monitoring
  - btop

  # Terminal file manager
  - yazi

  # Btrfs snapshots
  - snapper
  - pacman-contrib
