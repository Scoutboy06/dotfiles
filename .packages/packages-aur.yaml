# AUR packages (installed via paru/yay)
#
# Each item is a package with fields:
# name:        The package name (REQUIRED)
# device:      all|eliaspc|eliaslt|worklt|server (REQUIRED)
# environment: desktop|dev (REQUIRED)
#
# device and environment accept comma-separated lists (e.g., device: eliaspc,eliaslt).
#
packages:
- name: bitwarden-bin
  device: all
  environment: desktop
- name: bitwarden-cli-bin
  device: all
  environment: dev
- name: brave-bin
  device: all
  environment: desktop
- name: latex-mk
  device: all
  environment: dev
- name: ngrok
  device: all
  environment: dev
- name: opentabletdriver
  device: all
  environment: desktop
- name: pomodoro-tui
  device: all
  environment: dev
- name: r-quick-share-bin
  device: all
  environment: desktop
- name: spicetify-cli
  device: all
  environment: desktop
- name: vesktop-bin
  device: all
  environment: desktop
- name: whisper.cpp-cuda-bin
  device: all
  environment: dev
- name: zen-browser-bin
  device: all
  environment: desktop
