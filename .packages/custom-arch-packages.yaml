# Arch-only custom packages built from remote PKGBUILDs (makepkg).
# Used by run_onchange_after_install-custom-arch-packages.sh.tmpl
# Skipped on non-Arch systems (no makepkg).
#
# Each entry should have:
#   name: package name (used for build directory)
#   url: git URL to clone from
#   environment: desktop|dev (REQUIRED)
#
# environment accepts comma-separated lists (e.g., environment: desktop,dev).

custom_packages: []
