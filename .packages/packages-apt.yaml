# APT packages (Debian/Ubuntu)
#
# Each item is a package with fields:
# name:        The package name (REQUIRED)
# device:      all|eliaspc|eliaslt|worklt|server (REQUIRED)
# environment: desktop|dev (REQUIRED)
#
# device and environment accept comma-separated lists (e.g., device: eliaspc,eliaslt).
#
packages:
- name: starship
  device: all
  environment: dev
- name: zoxide
  device: all
  environment: dev
- name: fzf
  device: all
  environment: dev
- name: direnv
  device: all
  environment: dev
- name: eza
  device: all
  environment: dev
- name: bat
  device: all
  environment: dev
